plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing is read from keystore.properties (not in git). Without it, only debug builds can be made.
def keystoreProperties = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'io.github.solvai.pocketcompanion'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.solvai.pocketcompanion'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        ndk {
            // llama.cpp is only bundled for arm64.
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    packaging {
        jniLibs {
            // llama-server is launched as a process, so it must exist as a real file on disk.
            useLegacyPackaging true
        }
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "PocketCompanion-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    implementation project(':duix-sdk')
    // Links its own ONNX Runtime, so it cannot clash with the libonnxruntime.so the avatar engine uses.
    implementation files('libs/sherpa-onnx-static-link-onnxruntime-2.0.1.aar')
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.1'
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'

    testImplementation 'junit:junit:4.13.2'
}
